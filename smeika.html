<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Змейка</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 18px; background: radial-gradient(circle at top, #203b35, #101817 65%);
    color: #f3fff8; font-family: system-ui, Arial, sans-serif;
  }
  .game { width: min(94vw, 480px); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 1px; }
  .stats { display: flex; justify-content: space-between; margin: 12px 2px; color: #c5e7d5; font-weight: 700; }
  .board-wrap { position: relative; }
  canvas {
    display: block; width: 100%; aspect-ratio: 1; background: #0c1513;
    border: 2px solid #477b63; border-radius: 16px; box-shadow: 0 12px 40px #0008;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; border-radius: 16px; background: #07110edb;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay strong { font-size: 27px; }
  button {
    border: 0; border-radius: 12px; padding: 13px 22px; background: #75e0a1;
    color: #092016; font-size: 17px; font-weight: 800; cursor: pointer;
  }
  .hint { color: #a9c8b7; font-size: 13px; margin: 12px 0; }
  .controls { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 54px); gap: 7px; justify-content: center; margin: 12px auto 0; }
  .controls button { padding: 0; font-size: 23px; background: #244b3a; color: white; border: 1px solid #4d8768; touch-action: none; }
  .controls .up { grid-column: 2; grid-row: 1; }
  .controls .left { grid-column: 1; grid-row: 2; }
  .controls .down { grid-column: 2; grid-row: 2; }
  .controls .right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<main class="game">
  <h1>🐍 Змейка</h1>
  <div class="stats"><span>Счёт: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
  <div class="board-wrap">
    <canvas id="board" width="420" height="420" aria-label="Игровое поле"></canvas>
    <div class="overlay" id="overlay">
      <strong id="message">Готов играть?</strong>
      <span>Собирай яблоки и не врезайся!</span>
      <button id="start">Начать игру</button>
    </div>
  </div>
  <div class="hint">Управление: стрелки / WASD или кнопки ниже. На телефоне можно свайпать по полю.</div>
  <div class="controls" aria-label="Кнопки управления">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('start');
  const N = 21, CELL = canvas.width / N;
  let snake, apple, dir, nextDir, score, timer, running = false;
  let best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0}; score = 0;
    scoreEl.textContent = score; placeApple(); draw();
  }
  function placeApple() {
    do { apple = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
    while (snake.some(p => p.x === apple.x && p.y === apple.y));
  }
  function setDirection(name) {
    const dirs = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const d = dirs[name];
    if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }
  function draw() {
    ctx.fillStyle = '#0c1513'; ctx.fillRect(0,0,420,420);
    ctx.strokeStyle = '#172722'; ctx.lineWidth = 1;
    for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,420);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(420,i*CELL);ctx.stroke();}
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath();
    ctx.arc((apple.x+.5)*CELL,(apple.y+.5)*CELL,CELL*.36,0,Math.PI*2);ctx.fill();
    ctx.fillStyle = '#9cf0ad';
    snake.forEach((p,i)=>{ctx.beginPath();ctx.roundRect(p.x*CELL+1,p.y*CELL+1,CELL-2,CELL-2,5);ctx.fill();});
    const h=snake[0]; ctx.fillStyle='#153c29';
    ctx.beginPath();ctx.arc((h.x+.34)*CELL,(h.y+.35)*CELL,2.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc((h.x+.68)*CELL,(h.y+.35)*CELL,2.1,0,Math.PI*2);ctx.fill();
  }
  function step() {
    if(!running) return;
    dir = nextDir;
    const head = {x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const eating = head.x===apple.x && head.y===apple.y;
    const body = eating ? snake : snake.slice(0,-1);
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){endGame();return;}
    snake.unshift(head);
    if(eating){score+=10;scoreEl.textContent=score; if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snakeBest',best);} placeApple();}
    else snake.pop();
    draw();
  }
  function endGame() {
    running=false; clearInterval(timer); message.textContent='Игра окончена!';
    startBtn.textContent='Играть снова'; overlay.classList.remove('hidden');
  }
  function start() {
    clearInterval(timer); reset(); running=true; overlay.classList.add('hidden');
    timer=setInterval(step, Math.max(75,145-Math.floor(score/50)*5));
  }
  startBtn.addEventListener('click',start);
  document.addEventListener('keydown',e=>{
    const keys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
    if(keys[e.key]){e.preventDefault();setDirection(keys[e.key]);}
    if(e.key===' '&&!running) start();
  });
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(b.dataset.dir);});
  });
  let touchX=0,touchY=0;
  canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY;},{passive:true});
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0], dx=t.clientX-touchX, dy=t.clientY-touchY;
    if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  },{passive:true});
  reset();
})();
</script>
</body>
</html>
